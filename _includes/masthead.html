<div class="masthead">
  <div class="masthead__inner-wrap site-header">
    <div class="header-tools">
      <a class="icon-control home-link" href="{{ '/' | relative_url }}" aria-label="Home" title="Home"{% if page.url == '/' %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v12h13V9M9 21v-8h6v8"/></svg>
      </a>
      <button class="icon-control theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode" hidden>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z"/></svg>
      </button>
    </div>
    <button class="icon-control menu-toggle" type="button" aria-controls="primary-menu" aria-expanded="false" aria-label="Open navigation" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav class="site-navigation" aria-label="Main navigation">
      <ul id="primary-menu">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</div>
