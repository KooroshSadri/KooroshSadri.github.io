---
layout: archive
title: "Posts by category"
permalink: /categories/
---
{% for category in site.categories %}
<section id="{{ category[0] | slugify }}"><h2>{{ category[0] }}</h2><ul>
{% for post in category[1] %}<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>{% endfor %}
</ul></section>
{% endfor %}
